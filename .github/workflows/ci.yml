name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocks. Everything here passes today; red means this commit broke it.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O SDK entra como FONTE, não como pacote do npm.
      #
      # Antes o CI resolvia `@fayz-ai/*` do registry, e com isso toda mudança no
      # SDK exigia publicar antes de o totem poder usá-la — release virou
      # pré-requisito para subir qualquer coisa no painel. O painel nunca
      # precisou disso: o vite INLINA o SDK no bundle, e o totem não tem
      # `@fayz-ai` nem no `node_modules` nem no JS que roda.
      #
      # Com o checkout ao lado, o CI compila exatamente o que eu compilo na
      # máquina que faz o deploy, contra o commit do SDK que está em `main`.
      - name: SDK (fonte)
        uses: actions/checkout@v4
        with:
          repository: FayaLabs/fayz-sdk
          ref: main
          path: .sdk
          token: ${{ secrets.SDK_READ_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # `FAYZ_SDK_DIR` é alias do bundler; o `tsc` não o enxerga. O `paths` do
      # tsconfig.ci.json aponta o TypeScript para a mesma fonte.
      # `.sdk` vem do checkout acima, não do link local.
      - name: Typecheck
        run: npx tsc -p tsconfig.ci.json --noEmit

      # Runs BEFORE the E2E on purpose: one spec asserts the emitted service
      # worker and the fullscreen/portrait webmanifest by reading dist/.
      - name: Build
        run: npx vite build
        env:
          FAYZ_SDK_DIR: ${{ github.workspace }}/.sdk
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TENANT_ID: ${{ vars.VITE_TENANT_ID }}
          VITE_UNIT_ID: ${{ vars.VITE_UNIT_ID }}

      # The waiter's brain: pure TypeScript over the stores, no DOM, no audio,
      # no network. Runs before the browser is even installed.
      - name: Unit (cérebro do garçom)
        run: npm test
        env:
          FAYZ_SDK_DIR: ${{ github.workspace }}/.sdk

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The whole suite runs at the real panel size (1080x1920, touch on).
      # It proves the flow, the data and that the pixels did not move. It does
      # NOT prove physical reach, glare or fat-finger accuracy — that is the
      # in-store pilot (FAY-1450), not something a runner can check.
      - name: E2E (1080x1920)
        run: npm run e2e
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TENANT_ID: ${{ vars.VITE_TENANT_ID }}
          VITE_UNIT_ID: ${{ vars.VITE_UNIT_ID }}
          # A runner has no device credentials for the tenant, so the screens
          # are exercised against the demo menu. The live provider's shape is
          # covered by e2e/catalog-contract.spec.ts.
          VITE_TOTEM_CATALOG: demo

      - name: Upload the failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
